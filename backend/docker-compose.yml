

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: stores11
      POSTGRES_USER: stores11
      POSTGRES_PASSWORD: stores11
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://stores11:stores11@db:5432/stores11
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  postgres_data: